    limit_req_zone $binary_remote_addr zone=filework_requests:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=filework_connections:10m;
    server {
        listen 80;
        server_name aitools.cognitionsync.com;
        client_max_body_size 16k;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        location / { return 301 https://aitools.cognitionsync.com$request_uri; }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name aitools.cognitionsync.com;
        ssl_certificate /etc/letsencrypt/live/aitools.cognitionsync.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aitools.cognitionsync.com/privkey.pem;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 16k;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        send_timeout 30s;
        limit_req_status 429;
        limit_conn_status 429;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location / {
            limit_req zone=filework_requests burst=120 nodelay;
            limit_conn filework_connections 40;
            proxy_pass http://FILEWORK_UPSTREAM;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
