server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 30s;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    expires -1;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /health { access_log off; return 200 "ok\n"; }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        try_files $uri =404;
    }
    location /samples/ { try_files $uri =404; }
    location / { try_files $uri/index.html $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
